<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos recientes en Providencia y Santiago — UF/m²</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; }

  .panel {
    position: fixed;
    z-index: 1000;
    background: #fcfcfbee;
    border-radius: 8px;
    font-family: system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
    padding: 8px 16px;
  }

  #title-panel {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  #title-panel .title { font-size: 15px; font-weight: 600; color: #0b0b0b; }
  #title-panel .subtitle { font-size: 12px; color: #52514e; }

  #filter-panel {
    top: 70px;
    right: 10px;
    width: 210px;
    padding: 10px 14px 12px;
    font-size: 12px;
    color: #0b0b0b;
  }
  #filter-panel label { display: block; margin-top: 8px; font-weight: 600; }
  #filter-panel .range-value { font-weight: 400; color: #52514e; }
  #filter-panel .checkbox-row { margin-top: 10px; font-weight: 600; }
  #filter-panel .checkbox-row input { vertical-align: middle; }

  #bedrooms-row { display: flex; gap: 5px; margin-top: 4px; }
  #bedrooms-row button {
    flex: 1;
    padding: 4px 0;
    font: inherit;
    font-weight: 600;
    color: #52514e;
    background: #f2f1ee;
    border: 1px solid #d7d5d1;
    border-radius: 5px;
    cursor: pointer;
  }
  #bedrooms-row button.active {
    color: #fcfcfb;
    background: #2a78d6;
    border-color: #2a78d6;
  }

  /* two native range inputs overlaid on one shared track */
  .dual { position: relative; height: 24px; }
  .dual .track, .dual .fill {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
  }
  .dual .track { width: 100%; background: #d7d5d1; }
  .dual .fill { background: #2a78d6; }
  .dual input[type="range"] {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    height: 0;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    pointer-events: none;
  }
  .dual input:nth-of-type(1) { z-index: 1; }
  .dual input:nth-of-type(2) { z-index: 2; }
  .dual input::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    pointer-events: auto;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #2a78d6;
    border: 2px solid #fcfcfb;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    cursor: pointer;
  }
  .dual input::-moz-range-thumb {
    pointer-events: auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #2a78d6;
    border: 2px solid #fcfcfb;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    cursor: pointer;
  }

  #legend {
    bottom: 20px;
    right: 10px;
    padding: 8px 14px 10px;
    font-size: 11px;
    color: #52514e;
  }
  #legend .bar { height: 10px; border-radius: 3px; margin: 4px 0 2px; }
  #legend .labels { display: flex; justify-content: space-between; }

  .popup { font-family: system-ui, sans-serif; font-size: 13px; min-width: 220px; }
  .popup a { font-weight: 600; }
  .popup .rows { margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="title-panel" class="panel">
  <div class="title">Avisos recientes en Providencia y Santiago — UF/m²</div>
  <div class="subtitle" id="subtitle"></div>
</div>

<div id="filter-panel" class="panel">
  <label>Precio CLP <span class="range-value" id="price-value"></span></label>
  <div class="dual">
    <div class="track"></div><div class="fill" id="price-fill"></div>
    <input type="range" id="price-min" autocomplete="off">
    <input type="range" id="price-max" autocomplete="off">
  </div>
  <label>Superficie m² <span class="range-value" id="m2-value"></span></label>
  <div class="dual">
    <div class="track"></div><div class="fill" id="m2-fill"></div>
    <input type="range" id="m2-min" autocomplete="off">
    <input type="range" id="m2-max" autocomplete="off">
  </div>
  <label>Dormitorios</label>
  <div id="bedrooms-row">
    <button type="button" data-beds="1">1</button>
    <button type="button" data-beds="2">2</button>
    <button type="button" data-beds="3">3</button>
    <button type="button" data-beds="4">4+</button>
  </div>
  <div class="checkbox-row">
    <label><input type="checkbox" id="parking-only" autocomplete="off"> Solo con estacionamiento</label>
  </div>
</div>

<div id="legend" class="panel">
  UF/m² (útiles)
  <div class="bar" id="legend-bar"></div>
  <div class="labels"><span id="legend-min"></span><span id="legend-max"></span></div>
</div>

<script>
const CONFIG = {"colors": ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"], "vmin": 37, "vmax": 2572, "recentDays": 7, "maxM2": 100, "updated": "2026-09-02"};
const LISTINGS = [{"title": "Departamento Rosas Id: 105957", "url": "https://www.portalinmobiliario.com/MLC-4437286900-departamento-rosas-id-105957-_JM", "lat": -33.4375556, "lng": -70.6797768, "price_uf": 2691.1, "price_clp": 110000000.0, "m2_utiles": 67.0, "uf_per_m2": 40.17, "zona_uf_m2": 48.0, "bedrooms_n": 2.0, "parking": 0.0, "gastos_comunes_clp": 100000.0, "barrio": "Barrio Yungay", "first_seen_date": "2026-09-01"}, {"title": "Venta De Hermoso Departamento En Providencia", "url": "https://www.portalinmobiliario.com/MLC-4432301968-venta-de-hermoso-departamento-en-providencia-_JM", "lat": -33.4273835, "lng": -70.6190517, "price_uf": 3400.0, "price_clp": 138975306.0, "m2_utiles": 1.0, "uf_per_m2": 3400.0, "zona_uf_m2": 155.0, "bedrooms_n": 1.0, "parking": 0.0, "gastos_comunes_clp": 70000.0, "barrio": "Manuel Montt", "first_seen_date": "2026-08-31"}, {"title": "Departamento Libertad Id: 158886", "url": "https://www.portalinmobiliario.com/MLC-4422153388-departamento-libertad-id-158886-_JM", "lat": -33.4276703, "lng": -70.675337, "price_uf": 2320.0, "price_clp": 94830209.0, "m2_utiles": 64.0, "uf_per_m2": 36.25, "zona_uf_m2": 47.0, "bedrooms_n": 3.0, "parking": 0.0, "gastos_comunes_clp": 65000.0, "barrio": "Parque Los Reyes", "first_seen_date": "2026-08-29"}, {"title": "Excelente 1d1b Con Terraza En Santiago", "url": "https://www.portalinmobiliario.com/MLC-2195807755-excelente-1d1b-con-terraza-en-santiago-_JM", "lat": -33.4614515, "lng": -70.6461341, "price_uf": 1823.0, "price_clp": 74515289.0, "m2_utiles": 35.0, "uf_per_m2": 52.09, "zona_uf_m2": 74.0, "bedrooms_n": 1.0, "parking": 0.0, "gastos_comunes_clp": 50000.0, "barrio": "Parque O'Higgins", "first_seen_date": "2026-08-27"}, {"title": "Departamento Estudio En Venta | Santiago Centro", "url": "https://www.portalinmobiliario.com/MLC-4416381570-departamento-estudio-en-venta-santiago-centro-_JM", "lat": -33.4469379, "lng": -70.6523431, "price_uf": 1550.0, "price_clp": 63356389.0, "m2_utiles": 23.0, "uf_per_m2": 67.39, "zona_uf_m2": 74.0, "bedrooms_n": 1.0, "parking": 0.0, "gastos_comunes_clp": null, "barrio": "Bulnes", "first_seen_date": "2026-08-27"}, {"title": "Departamento Santa Elvira Id: 157580", "url": "https://www.portalinmobiliario.com/MLC-4410884474-departamento-santa-elvira-id-157580-_JM", "lat": -33.4579254, "lng": -70.6296279, "price_uf": 2850.0, "price_clp": 116494006.0, "m2_utiles": 32.0, "uf_per_m2": 89.06, "zona_uf_m2": 82.0, "bedrooms_n": 1.0, "parking": 0.0, "gastos_comunes_clp": 80000.0, "barrio": "Bogotá - Sierra Bella", "first_seen_date": "2026-08-27"}];

const fmt = (value, decimals = 0) =>
  value == null
    ? null
    : Number(value).toLocaleString("es-CL", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });

function color(value) {
  const { colors, vmin, vmax } = CONFIG;
  const t = Math.min(Math.max((value - vmin) / (vmax - vmin), 0), 1);
  const position = t * (colors.length - 1);
  const index = Math.min(Math.floor(position), colors.length - 2);
  const mix = position - index;

  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const [a, b] = [rgb(colors[index]), rgb(colors[index + 1])];

  return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * mix)).join(",")})`;
}

function popupHtml(listing) {
  const rows = [
    ["Precio", fmt(listing.price_uf) && fmt(listing.price_uf) + " UF"],
    ["", fmt(listing.price_clp) && "$" + fmt(listing.price_clp)],
    ["Superficie", fmt(listing.m2_utiles) && fmt(listing.m2_utiles) + " m²"],
    ["UF/m²", fmt(listing.uf_per_m2, 1)],
    ["Zona UF/m²", fmt(listing.zona_uf_m2)],
    ["Dormitorios", fmt(listing.bedrooms_n)],
    ["Estacionamientos", fmt(listing.parking)],
    ["Gastos comunes", fmt(listing.gastos_comunes_clp) && "$" + fmt(listing.gastos_comunes_clp)],
    ["Barrio", listing.barrio],
    ["Publicado desde", listing.first_seen_date],
  ];

  const lines = rows
    .filter(([, value]) => value != null)
    .map(([label, value]) =>
      label ? `<div><b>${label}:</b> ${value}</div>` : `<div>${value}</div>`
    )
    .join("");

  return `<div class="popup">
    <a href="${listing.url}" target="_blank">${listing.title}</a>
    <div class="rows">${lines}</div>
  </div>`;
}

const map = L.map("map");

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
    '&copy; <a href="https://carto.com/attributions">CARTO</a>',
}).addTo(map);

// Frame all listings so every comuna is visible on load. A fixed-zoom mean
// center drifts toward whichever comuna has the most points (e.g. Santiago),
// pushing the eastern comunas (Providencia, Las Condes) off-screen.
function frameListings(attempt = 0) {
  if (!LISTINGS.length) {
    map.setView([-33.43, -70.62], 12);
    return;
  }
  map.invalidateSize();
  // fitBounds derives zoom from the container size; if it runs before layout
  // settles the container reads as 0px and Leaflet slams to max zoom. Wait for
  // a real size (retry a few frames), and cap the zoom as a safety net.
  if (map.getSize().x < 1 && attempt < 20) {
    requestAnimationFrame(() => frameListings(attempt + 1));
    return;
  }
  map.fitBounds(
    LISTINGS.map((l) => [l.lat, l.lng]),
    { padding: [30, 30], maxZoom: 14 }
  );
}
requestAnimationFrame(() => frameListings());

const markers = LISTINGS.map((listing) => ({
  listing,
  marker: L.circleMarker([listing.lat, listing.lng], {
    radius: 6,
    color: "#fcfcfb",
    weight: 1,
    fill: true,
    fillColor: color(listing.uf_per_m2),
    fillOpacity: 0.9,
  })
    .bindTooltip(`${fmt(listing.uf_per_m2, 1)} UF/m² · ${fmt(listing.price_uf)} UF`)
    .bindPopup(popupHtml(listing), { maxWidth: 320 }),
}));

// filters
const priceMin = document.getElementById("price-min");
const priceMax = document.getElementById("price-max");
const m2Min = document.getElementById("m2-min");
const m2Max = document.getElementById("m2-max");
const parkingOnly = document.getElementById("parking-only");
const bedroomButtons = [...document.querySelectorAll("#bedrooms-row button")];
// set of selected bedroom counts (4 means "4 or more"); empty = show all
const bedroomsSelected = new Set();

const prices = LISTINGS.map((l) => l.price_clp);
const step = 5_000_000;
priceMin.min = priceMax.min = Math.floor(Math.min(...prices) / step) * step;
priceMin.max = priceMax.max = Math.ceil(Math.max(...prices) / step) * step;
priceMin.step = priceMax.step = step;
priceMin.value = priceMin.min;
priceMax.value = priceMax.max;

const areas = LISTINGS.map((l) => l.m2_utiles);
m2Min.min = m2Max.min = Math.floor(Math.min(...areas));
m2Min.max = m2Max.max = Math.ceil(Math.max(...areas));
m2Min.value = m2Min.min;
m2Max.value = m2Max.max;

function updateDual(minEl, maxEl, fillId) {
  const bounds = [Number(minEl.min), Number(minEl.max)];
  const pct = (v) => ((v - bounds[0]) / (bounds[1] - bounds[0])) * 100;

  const fill = document.getElementById(fillId);
  fill.style.left = pct(Number(minEl.value)) + "%";
  fill.style.width = pct(Number(maxEl.value)) - pct(Number(minEl.value)) + "%";

  // when both thumbs sit at the top end only the upper input is clickable,
  // so raise the lower one above it on the upper half of the track
  minEl.style.zIndex = Number(minEl.value) > (bounds[0] + bounds[1]) / 2 ? 3 : 1;
}

function applyFilters() {
  // keep min/max handle pairs from crossing
  if (Number(priceMin.value) > Number(priceMax.value)) {
    if (this === priceMin) priceMax.value = priceMin.value;
    else priceMin.value = priceMax.value;
  }
  if (Number(m2Min.value) > Number(m2Max.value)) {
    if (this === m2Min) m2Max.value = m2Min.value;
    else m2Min.value = m2Max.value;
  }

  document.getElementById("price-value").textContent =
    `$${fmt(priceMin.value / 1e6)}M – $${fmt(priceMax.value / 1e6)}M`;
  document.getElementById("m2-value").textContent =
    `${m2Min.value} – ${m2Max.value}`;

  updateDual(priceMin, priceMax, "price-fill");
  updateDual(m2Min, m2Max, "m2-fill");

  let visible = 0;

  for (const { listing, marker } of markers) {
    const show =
      listing.price_clp >= Number(priceMin.value) &&
      listing.price_clp <= Number(priceMax.value) &&
      listing.m2_utiles >= Number(m2Min.value) &&
      listing.m2_utiles <= Number(m2Max.value) &&
      (!parkingOnly.checked || listing.parking >= 1) &&
      (bedroomsSelected.size === 0 ||
        (listing.bedrooms_n != null &&
          bedroomsSelected.has(Math.min(listing.bedrooms_n, 4))));

    if (show) {
      marker.addTo(map);
      visible += 1;
    } else {
      marker.remove();
    }
  }

  document.getElementById("subtitle").textContent =
    `${visible} de ${LISTINGS.length} departamentos <${CONFIG.maxM2} m² ` +
    `publicados o listados recientemente · ${CONFIG.updated}`;
}

for (const input of [priceMin, priceMax, m2Min, m2Max, parkingOnly]) {
  input.addEventListener("input", applyFilters);
}

for (const btn of bedroomButtons) {
  btn.addEventListener("click", () => {
    const beds = Number(btn.dataset.beds);
    if (bedroomsSelected.has(beds)) bedroomsSelected.delete(beds);
    else bedroomsSelected.add(beds);
    btn.classList.toggle("active");
    applyFilters();
  });
}

applyFilters();

// legend
document.getElementById("legend-bar").style.background =
  `linear-gradient(to right, ${CONFIG.colors.join(",")})`;
document.getElementById("legend-min").textContent = fmt(CONFIG.vmin);
document.getElementById("legend-max").textContent = fmt(CONFIG.vmax);
</script>
</body>
</html>
