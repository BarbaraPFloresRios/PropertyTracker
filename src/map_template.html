<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos recientes en __COMUNAS__ — UF/m²</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; }

  .panel {
    position: fixed;
    z-index: 1000;
    background: #fcfcfbee;
    border-radius: 8px;
    font-family: system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
    padding: 8px 16px;
  }

  #title-panel {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  #title-panel .title { font-size: 15px; font-weight: 600; color: #0b0b0b; }
  #title-panel .subtitle { font-size: 12px; color: #52514e; }

  #filter-panel {
    top: 70px;
    right: 10px;
    width: 210px;
    padding: 10px 14px 12px;
    font-size: 12px;
    color: #0b0b0b;
  }
  #filter-panel label { display: block; margin-top: 8px; font-weight: 600; }
  #filter-panel .range-value { font-weight: 400; color: #52514e; }
  #filter-panel .checkbox-row { margin-top: 10px; font-weight: 600; }
  #filter-panel .checkbox-row input { vertical-align: middle; }

  #bedrooms-row { display: flex; gap: 5px; margin-top: 4px; }
  #bedrooms-row button {
    flex: 1;
    padding: 4px 0;
    font: inherit;
    font-weight: 600;
    color: #52514e;
    background: #f2f1ee;
    border: 1px solid #d7d5d1;
    border-radius: 5px;
    cursor: pointer;
  }
  #bedrooms-row button.active {
    color: #fcfcfb;
    background: #2a78d6;
    border-color: #2a78d6;
  }

  /* market toggle: same visual language as the bedroom buttons, but the
     active colour matches the market's ramp so the switch and the legend
     always agree on what you're looking at */
  #market-row { display: flex; gap: 5px; margin-top: 6px; }
  #market-row button {
    flex: 1;
    padding: 4px 0;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: #52514e;
    background: #f2f1ee;
    border: 1px solid #d7d5d1;
    border-radius: 5px;
    cursor: pointer;
  }
  #market-row button.active[data-market="venta"] {
    color: #fcfcfb; background: #2a78d6; border-color: #2a78d6;
  }
  #market-row button.active[data-market="arriendo"] {
    color: #fcfcfb; background: #8352c4; border-color: #8352c4;
  }
  #market-row button[disabled] { opacity: .45; cursor: default; }

  /* two native range inputs overlaid on one shared track */
  .dual { position: relative; height: 24px; }
  .dual .track, .dual .fill {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
  }
  .dual .track { width: 100%; background: #d7d5d1; }
  .dual .fill { background: #2a78d6; }
  .dual input[type="range"] {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    height: 0;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    pointer-events: none;
  }
  .dual input:nth-of-type(1) { z-index: 1; }
  .dual input:nth-of-type(2) { z-index: 2; }
  .dual input::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    pointer-events: auto;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #2a78d6;
    border: 2px solid #fcfcfb;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    cursor: pointer;
  }
  .dual input::-moz-range-thumb {
    pointer-events: auto;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #2a78d6;
    border: 2px solid #fcfcfb;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    cursor: pointer;
  }

  #legend {
    bottom: 20px;
    right: 10px;
    padding: 8px 14px 10px;
    font-size: 11px;
    color: #52514e;
  }
  #legend .bar { height: 10px; border-radius: 3px; margin: 4px 0 2px; }
  #legend .labels { display: flex; justify-content: space-between; }

  /* Desktop keeps the two top panels independently fixed, so #controls must
     not introduce a box of its own. */
  #controls { display: contents; }

  /* Phones. Every panel was positioned with fixed coordinates chosen for a
     wide window: the title centred at top:10 and the filters pinned at
     top:70. A long title wraps to three lines on a narrow screen and runs
     straight under the filter panel. Stacking them in one flow column means
     neither has to guess the other's height. */
  @media (max-width: 600px) {
    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: fixed;
      z-index: 1000;
      top: 8px;
      left: 8px;
      right: 8px;
      /* leave the lower half of the map visible and reachable */
      max-height: 62vh;
    }
    #controls .panel {
      position: static;
      width: auto;
      transform: none;
      min-width: 0;
    }
    #title-panel .title { font-size: 14px; }
    /* the filters are the part that can grow without bound, so they are the
       part that scrolls */
    #filter-panel { overflow-y: auto; padding: 8px 14px 10px; }
    /* clear of Leaflet's attribution bar, which sits flush at the bottom and
       is the one element on the map we are not free to cover. On a narrow
       screen that bar wraps to two lines and spans the full width, so it is
       ~34px tall rather than the ~17px it takes on a desktop. */
    #legend { bottom: 44px; left: 10px; right: auto; }
  }

  .popup { font-family: system-ui, sans-serif; font-size: 13px; min-width: 220px; }
  .popup a { font-weight: 600; }
  .popup .rows { margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls">
<div id="title-panel" class="panel">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div id="market-row">
    <button type="button" data-market="venta">Venta</button>
    <button type="button" data-market="arriendo">Arriendo</button>
  </div>
</div>

<div id="filter-panel" class="panel">
  <label><span id="price-label">Precio</span> <span class="range-value" id="price-value"></span></label>
  <div class="dual">
    <div class="track"></div><div class="fill" id="price-fill"></div>
    <input type="range" id="price-min" autocomplete="off">
    <input type="range" id="price-max" autocomplete="off">
  </div>
  <label>Superficie m² <span class="range-value" id="m2-value"></span></label>
  <div class="dual">
    <div class="track"></div><div class="fill" id="m2-fill"></div>
    <input type="range" id="m2-min" autocomplete="off">
    <input type="range" id="m2-max" autocomplete="off">
  </div>
  <label>Publicado hace <span class="range-value" id="age-value"></span></label>
  <div class="dual">
    <div class="track"></div><div class="fill" id="age-fill"></div>
    <input type="range" id="age-max" autocomplete="off">
  </div>
  <label>Dormitorios</label>
  <div id="bedrooms-row">
    <button type="button" data-beds="1">1</button>
    <button type="button" data-beds="2">2</button>
    <button type="button" data-beds="3">3</button>
    <button type="button" data-beds="4">4+</button>
  </div>
  <div class="checkbox-row">
    <label><input type="checkbox" id="parking-only" autocomplete="off"> Solo con estacionamiento</label>
  </div>
</div>
</div>

<div id="legend" class="panel">
  <span id="legend-title"></span>
  <div class="bar" id="legend-bar"></div>
  <div class="labels"><span id="legend-min"></span><span id="legend-max"></span></div>
</div>

<script>
const CONFIG = __CONFIG__;
const COMUNAS = "__COMUNAS__";

const fmt = (value, decimals = 0) =>
  value == null
    ? null
    : Number(value).toLocaleString("es-CL", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });

// Per-market presentation. The DATA differences live in CONFIG.markets (its
// rows, its ramp, which field the ramp reads); this holds only how to label and
// format them. The filters are deliberately shared: both markets carry
// price_clp, m2_utiles, bedrooms_n, parking and publicado_fecha_est, so only
// the price slider's scale has to change.
const MARKET_UI = {
  venta: {
    title: (comunas) => `Avisos recientes en ${comunas} — venta, UF/m²`,
    legend: "UF/m² (útiles)",
    priceLabel: "Precio CLP",
    priceStep: 5000000,
    priceText: (lo, hi) => `$${fmt(lo / 1e6)}M – $${fmt(hi / 1e6)}M`,
    tooltip: (l) => `${fmt(l.uf_per_m2, 1)} UF/m² · ${fmt(l.price_uf)} UF`,
    rows: (l) => [
      ["Precio", fmt(l.price_uf) && fmt(l.price_uf) + " UF"],
      ["", fmt(l.price_clp) && "$" + fmt(l.price_clp)],
      ["Superficie", fmt(l.m2_utiles) && fmt(l.m2_utiles) + " m²"],
      ["UF/m²", fmt(l.uf_per_m2, 1)],
    ],
    // No m² claim here any more: the map dropped the export's 150 m² ceiling,
    // it only keeps a floor to filter out mis-parsed surfaces.
    subtitle: (visible, total) =>
      `${visible} de ${total} en venta · ventana de ${CONFIG.recentDays} ` +
      `días · ${CONFIG.updated}`,
  },
  arriendo: {
    title: (comunas) => `Avisos recientes en ${comunas} — arriendo, CLP/m²`,
    legend: "CLP/m² mensual (útiles)",
    priceLabel: "Arriendo mensual CLP",
    priceStep: 50000,
    priceText: (lo, hi) => `$${fmt(lo)} – $${fmt(hi)}`,
    tooltip: (l) => `$${fmt(l.clp_m2)}/m² · $${fmt(l.price_clp)}/mes`,
    rows: (l) => [
      ["Arriendo", fmt(l.price_clp) && "$" + fmt(l.price_clp) + "/mes"],
      ["Superficie", fmt(l.m2_utiles) && fmt(l.m2_utiles) + " m²"],
      ["CLP/m²", fmt(l.clp_m2) && "$" + fmt(l.clp_m2)],
    ],
    // No recency window on this side: only ~68% of rentals expose a
    // publication date, so the rental layer is the whole live market.
    subtitle: (visible, total) =>
      `${visible} de ${total} en arriendo · disponibles hoy · ${CONFIG.updated}`,
  },
};

function color(value, market) {
  const { colors, vmin, vmax } = market;
  const t = Math.min(Math.max((value - vmin) / (vmax - vmin), 0), 1);
  const position = t * (colors.length - 1);
  const index = Math.min(Math.floor(position), colors.length - 2);
  const mix = position - index;

  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const [a, b] = [rgb(colors[index]), rgb(colors[index + 1])];

  return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * mix)).join(",")})`;
}

function popupHtml(listing, marketUi) {
  const rows = [
    ...marketUi.rows(listing),
    ["Dormitorios", fmt(listing.bedrooms_n)],
    ["Estacionamientos", fmt(listing.parking)],
    ["Gastos comunes", fmt(listing.gastos_comunes_clp) && "$" + fmt(listing.gastos_comunes_clp)],
    ["Barrio", listing.barrio],
    ["Publicado", listing.publicado_fecha_est],
  ];

  const lines = rows
    .filter(([, value]) => value != null)
    .map(([label, value]) =>
      label ? `<div><b>${label}:</b> ${value}</div>` : `<div>${value}</div>`
    )
    .join("");

  return `<div class="popup">
    <a href="${listing.url}" target="_blank">${listing.title}</a>
    <div class="rows">${lines}</div>
  </div>`;
}

const map = L.map("map");

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution:
    "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ &copy; " +
    '<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 16,
}).addTo(map);

// Frame all listings so every comuna is visible. A fixed-zoom mean center
// drifts toward whichever comuna has the most points (e.g. Santiago), pushing
// the eastern comunas (Providencia, Las Condes) off-screen.
function frameListings(points, attempt = 0) {
  if (!points.length) {
    map.setView([-33.43, -70.62], 12);
    return;
  }
  map.invalidateSize();
  // fitBounds derives zoom from the container size; if it runs before layout
  // settles the container reads as 0px and Leaflet slams to max zoom. Wait for
  // a real size (retry a few frames), and cap the zoom as a safety net.
  if (map.getSize().x < 1 && attempt < 20) {
    requestAnimationFrame(() => frameListings(points, attempt + 1));
    return;
  }
  map.fitBounds(points, { padding: [30, 30], maxZoom: 14 });
}

// filters
const priceMin = document.getElementById("price-min");
const priceMax = document.getElementById("price-max");
const m2Min = document.getElementById("m2-min");
const m2Max = document.getElementById("m2-max");
const ageMax = document.getElementById("age-max");
const parkingOnly = document.getElementById("parking-only");
const bedroomButtons = [...document.querySelectorAll("#bedrooms-row button")];
const marketButtons = [...document.querySelectorAll("#market-row button")];

// set of selected bedroom counts (4 means "4 or more"); empty = show all
const bedroomsSelected = new Set();

// current market, set by renderMarket()
let active = null;
let ui = null;
let markers = [];

// Age in days of a listing, measured against the dataset date rather than the
// viewer's clock, so the filter means the same thing whenever the map is
// opened. Returns null when the listing has no publication date -- the site
// doesn't show one for developments, and only ~67% of rentals carry it.
const DATASET_DAY = new Date(CONFIG.updated + "T00:00:00");

function ageInDays(listing) {
  if (!listing.publicado_fecha_est) return null;
  const published = new Date(listing.publicado_fecha_est + "T00:00:00");
  if (isNaN(published)) return null;
  return Math.round((DATASET_DAY - published) / 86400000);
}

function setRange(minEl, maxEl, lo, hi, step) {
  minEl.min = maxEl.min = Math.floor(lo / step) * step;
  minEl.max = maxEl.max = Math.ceil(hi / step) * step;
  minEl.step = maxEl.step = step;
  minEl.value = minEl.min;
  maxEl.value = maxEl.max;
}

function updateDual(minEl, maxEl, fillId) {
  const bounds = [Number(minEl.min), Number(minEl.max)];
  const pct = (v) => ((v - bounds[0]) / (bounds[1] - bounds[0])) * 100;

  const fill = document.getElementById(fillId);
  fill.style.left = pct(Number(minEl.value)) + "%";
  fill.style.width = pct(Number(maxEl.value)) - pct(Number(minEl.value)) + "%";

  // when both thumbs sit at the top end only the upper input is clickable,
  // so raise the lower one above it on the upper half of the track
  minEl.style.zIndex = Number(minEl.value) > (bounds[0] + bounds[1]) / 2 ? 3 : 1;
}

function applyFilters() {
  // keep min/max handle pairs from crossing
  if (Number(priceMin.value) > Number(priceMax.value)) {
    if (this === priceMin) priceMax.value = priceMin.value;
    else priceMin.value = priceMax.value;
  }
  if (Number(m2Min.value) > Number(m2Max.value)) {
    if (this === m2Min) m2Max.value = m2Min.value;
    else m2Min.value = m2Max.value;
  }

  document.getElementById("price-value").textContent =
    ui.priceText(Number(priceMin.value), Number(priceMax.value));
  document.getElementById("m2-value").textContent =
    `${m2Min.value} – ${m2Max.value}`;

  updateDual(priceMin, priceMax, "price-fill");
  updateDual(m2Min, m2Max, "m2-fill");

  // At its maximum the age slider means "no limit", which also keeps the
  // listings with no publication date visible. Narrow it and they drop out --
  // we can't claim an age we don't have.
  const ageLimit = Number(ageMax.value);
  const ageUnlimited = ageLimit >= Number(ageMax.max);

  let undated = 0;
  for (const { listing } of markers) if (listing._age == null) undated += 1;

  document.getElementById("age-value").textContent = ageUnlimited
    ? "cualquiera"
    : `≤ ${ageLimit} días` + (undated ? ` · ${undated} sin fecha` : "");

  {
    const lo = Number(ageMax.min);
    const hi = Number(ageMax.max);
    const fill = document.getElementById("age-fill");
    fill.style.left = "0%";
    fill.style.width = ((ageLimit - lo) / (hi - lo)) * 100 + "%";
  }

  let visible = 0;

  for (const { listing, marker } of markers) {
    const show =
      listing.price_clp >= Number(priceMin.value) &&
      listing.price_clp <= Number(priceMax.value) &&
      listing.m2_utiles >= Number(m2Min.value) &&
      listing.m2_utiles <= Number(m2Max.value) &&
      (ageUnlimited || (listing._age != null && listing._age <= ageLimit)) &&
      (!parkingOnly.checked || listing.parking >= 1) &&
      (bedroomsSelected.size === 0 ||
        (listing.bedrooms_n != null &&
          bedroomsSelected.has(Math.min(listing.bedrooms_n, 4))));

    if (show) {
      marker.addTo(map);
      visible += 1;
    } else {
      marker.remove();
    }
  }

  document.getElementById("subtitle").textContent =
    ui.subtitle(visible, markers.length);
}

function renderMarket(key) {
  active = CONFIG.markets[key];
  ui = MARKET_UI[key];

  for (const { marker } of markers) marker.remove();

  for (const listing of active.listings) listing._age = ageInDays(listing);

  markers = active.listings.map((listing) => ({
    listing,
    marker: L.circleMarker([listing.lat, listing.lng], {
      radius: 6,
      color: "#fcfcfb",
      weight: 1,
      fill: true,
      fillColor: color(listing[active.metric], active),
      fillOpacity: 0.9,
    })
      .bindTooltip(ui.tooltip(listing))
      .bindPopup(popupHtml(listing, ui), { maxWidth: 320 }),
  }));

  // Each market gets its own slider bounds: sale prices run in the hundreds of
  // millions and monthly rents in the hundreds of thousands, so one shared
  // scale would leave either market unusable.
  const prices = markers.map(({ listing }) => listing.price_clp);
  setRange(priceMin, priceMax, Math.min(...prices), Math.max(...prices), ui.priceStep);

  const areas = markers.map(({ listing }) => listing.m2_utiles);
  setRange(m2Min, m2Max, Math.min(...areas), Math.max(...areas), 1);

  // The age slider spans the generated window and starts wide open.
  ageMax.min = 1;
  ageMax.max = CONFIG.recentDays;
  ageMax.step = 1;
  ageMax.value = CONFIG.recentDays;

  document.getElementById("title").textContent = ui.title(COMUNAS);
  document.getElementById("price-label").textContent = ui.priceLabel;
  document.getElementById("legend-title").textContent = ui.legend;
  document.getElementById("legend-bar").style.background =
    `linear-gradient(to right, ${active.colors.join(",")})`;
  document.getElementById("legend-min").textContent = fmt(active.vmin);
  document.getElementById("legend-max").textContent = fmt(active.vmax);

  for (const btn of marketButtons) {
    btn.classList.toggle("active", btn.dataset.market === key);
  }

  applyFilters();
  frameListings(markers.map(({ listing }) => [listing.lat, listing.lng]));
}

for (const input of [priceMin, priceMax, m2Min, m2Max, ageMax, parkingOnly]) {
  input.addEventListener("input", applyFilters);
}

for (const btn of bedroomButtons) {
  btn.addEventListener("click", () => {
    const beds = Number(btn.dataset.beds);
    if (bedroomsSelected.has(beds)) bedroomsSelected.delete(beds);
    else bedroomsSelected.add(beds);
    btn.classList.toggle("active");
    applyFilters();
  });
}

for (const btn of marketButtons) {
  // A market with no data (e.g. the rental CSV not scraped yet) is disabled
  // rather than hidden, so the map still works and the reason is visible.
  if (!CONFIG.markets[btn.dataset.market]) {
    btn.disabled = true;
    continue;
  }
  btn.addEventListener("click", () => renderMarket(btn.dataset.market));
}

requestAnimationFrame(() => renderMarket("venta"));
</script>

</body>
</html>
