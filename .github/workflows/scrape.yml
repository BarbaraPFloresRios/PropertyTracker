name: Scrape Listings

on:
  schedule:
    # 23:00 UTC = 20:00 in Chile during DST (UTC-3), 19:00 otherwise (UTC-4).
    # Chosen deliberately: the self-hosted runner lives on a personal machine
    # that is awake roughly between 19:00 and 22:00. A cron at night or in the
    # morning just queues until the lid is opened, so a second daily pass buys
    # nothing. One is enough -- the scrape re-reads the whole window (~2,000
    # per comuna, several days of slack), it isn't incremental.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    # Self-hosted runner: since 2026-09-29 the site answers HTTP 200 with no
    # content to GitHub's datacenter IPs (both search and detail pages), so the
    # scrape only works from a residential Chilean connection. If the machine
    # is asleep at cron time the job queues and runs when it wakes up.
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/setup-python is NOT used: on a self-hosted macOS runner the
      # package it downloads has /Users/runner/hostedtoolcache hardcoded in its
      # install script (Python binaries carry absolute paths), it fails with
      # "mkdir: /Users/runner: Permission denied", and no environment variable
      # redirects it. Instead: a persistent venv built from the machine's own
      # Python, which also gets reused between runs.
      - name: Set up Python venv
        run: |
          VENV="$HOME/.venvs/propertytracker"
          if [ ! -x "$VENV/bin/python" ]; then
            PY=""
            for c in python3.11 /usr/local/bin/python3 /opt/homebrew/bin/python3 python3; do
              if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
            done
            if [ -z "$PY" ]; then echo "No python3 found"; exit 1; fi
            echo "Creating venv with $PY ($($PY --version 2>&1))"
            "$PY" -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --disable-pip-version-check -r requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run scraper
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/*.csv data/recent_listings.csv data/uf_value.json README.md docs/map.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update listings data"

          # Retry with rebase to survive concurrent pushes to main
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying ($i/5)..."
            git pull --rebase --autostash origin main
          done

          echo "Push failed after 5 attempts"
          exit 1
