name: Scrape Listings

on:
  schedule:
    # 23:00 UTC = 20:00 Chile en verano (UTC-3), 19:00 en invierno (UTC-4).
    # Elegido asi a proposito: el runner self-hosted vive en una maquina personal,
    # esta despierto aprox. entre las 19:00 y 22:00. Un cron de madrugada o
    # de manana queda encolado hasta que abre la tapa, asi que no sirve de nada
    # tener dos pasadas al dia. Con una alcanza: el scrape relee la ventana
    # completa (~2.000 por comuna, varios dias de holgura), no es incremental.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    # Runner self-hosted: desde 2026-09-29 el portal
    # responde HTTP 200 sin contenido a las IPs de datacenter de GitHub
    # (busqueda Y fichas de detalle), asi que el scrape solo funciona
    # desde una IP residencial chilena. Si el Mac esta dormido a la hora
    # del cron, el job queda encolado y corre al despertar.
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/*.csv data/recent_listings.csv data/uf_value.json README.md docs/map.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update listings data"

          # Retry with rebase to survive concurrent pushes to main
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying ($i/5)..."
            git pull --rebase --autostash origin main
          done

          echo "Push failed after 5 attempts"
          exit 1
