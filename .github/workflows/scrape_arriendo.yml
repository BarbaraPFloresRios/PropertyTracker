name: Scrape Rentals

on:
  schedule:
    # 23:00 UTC todos los dias = 20:00 Chile en verano (UTC-3), 19:00 en
    # invierno. Mismo horario que scrape.yml a proposito: el runner self-hosted
    # corre UN job a la vez, asi que arriendos queda encolado y arranca cuando
    # ventas termina. La serializacion separa las dos rafagas de fetches sin
    # tener que inventar un horario aparte (y un horario mas tarde arriesgaria
    # caer fuera de la ventana en que la maquina esta despierta).
    #
    # Paso de semanal a DIARIO el 2026-10-11: entran ~1.850 arriendos nuevos por
    # semana, asi que una sola pasada semanal pedia ~1.940 fetches de golpe y,
    # sumada a los ~2.200 de ventas esa misma noche, caia en la zona donde el
    # portal estrangula (medido: ~4.000 fetches acumulados en un dia -> 429).
    # Diario son ~264 avisos nuevos por run (~356 fetches): el total de la noche
    # queda en ~2.550, cerca de los 2.192 que corrieron limpios, y la cola de
    # enriquecimiento no se forma nunca.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    # Runner self-hosted: desde 2026-09-29 el portal
    # responde HTTP 200 sin contenido a las IPs de datacenter de GitHub
    # (busqueda Y fichas de detalle), asi que el scrape solo funciona
    # desde una IP residencial chilena. Si el Mac esta dormido a la hora
    # del cron, el job queda encolado y corre al despertar.
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # No se usa actions/setup-python: en un runner self-hosted de macOS el
      # paquete que baja trae la ruta /Users/runner/hostedtoolcache hardcodeada
      # en su script de instalacion (los binarios de Python llevan rutas
      # absolutas embebidas), falla con "mkdir: /Users/runner: Permission
      # denied" y ninguna variable de entorno lo redirige. En su lugar: un venv
      # persistente con el Python de la maquina, que ademas se reusa entre runs.
      - name: Set up Python venv
        run: |
          VENV="$HOME/.venvs/propertytracker"
          if [ ! -x "$VENV/bin/python" ]; then
            PY=""
            for c in python3.11 /usr/local/bin/python3 /opt/homebrew/bin/python3 python3; do
              if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
            done
            if [ -z "$PY" ]; then echo "No encontre un python3"; exit 1; fi
            echo "Creando venv con $PY ($($PY --version 2>&1))"
            "$PY" -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --disable-pip-version-check -r requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run rental scraper
        run: python main_arriendo.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/portalinmobiliario_rentals.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update rental listings data"

          # Retry with rebase to survive concurrent pushes to main
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying ($i/5)..."
            git pull --rebase --autostash origin main
          done

          echo "Push failed after 5 attempts"
          exit 1
