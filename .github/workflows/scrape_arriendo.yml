name: Scrape Rentals

on:
  schedule:
    # Viernes 23:00 UTC = 20:00 Chile en verano (UTC-3), 19:00 en invierno.
    # Mismo criterio que scrape.yml: el runner es el Mac de Barbara y hay que
    # caer en su ventana despierta (19-22), no de madrugada.
    - cron: "0 23 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    # Runner self-hosted en el Mac de Barbara: desde 2026-09-29 el portal
    # responde HTTP 200 sin contenido a las IPs de datacenter de GitHub
    # (busqueda Y fichas de detalle), asi que el scrape solo funciona
    # desde una IP residencial chilena. Si el Mac esta dormido a la hora
    # del cron, el job queda encolado y corre al despertar.
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rental scraper
        run: python main_arriendo.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/portalinmobiliario_rentals.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update rental listings data"

          # Retry with rebase to survive concurrent pushes to main
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying ($i/5)..."
            git pull --rebase --autostash origin main
          done

          echo "Push failed after 5 attempts"
          exit 1
