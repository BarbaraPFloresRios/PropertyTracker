name: Scrape Rentals

on:
  schedule:
    # BACKUP ONLY, same as scrape.yml -- see the rationale there. The primary
    # trigger is the launchd agent on the runner's Mac, which runs THIS
    # workflow first and the sale one after it: the map is built by the sale
    # pipeline reading both CSVs, so rentals landing second publishes a map
    # carrying the previous rental layer.
    #
    # 00:30 UTC = 21:30 in Chile during DST (UTC-3), 20:30 otherwise.
    #
    # Weekly -> DAILY on 2026-10-11: ~1,850 new rentals arrive per week, so one
    # weekly pass asked for ~1,940 requests in a single burst. Daily spreads it
    # to ~264 new listings per run (~356 requests) and keeps the enrichment
    # backlog from building up.
    #
    # An earlier version of this comment blamed the burst on a "~4,000 requests
    # per day" ceiling. That number was never measured and the data contradicts
    # it: counting where the 429s fall, they start at the ~565th request of a
    # run and continue at a flat ~2% to the end, with no ramp -- a rate, not a
    # quota. The wall that does exist is concurrency (four parallel workers ran
    # clean to ~1,360 fetches, then took 420 consecutive 403s), which is why
    # every fetch here stays sequential.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both workflows share one self-hosted runner and both push to main, so they
# must never overlap. The group name is deliberately the same in both files:
# it serialises them against each other, not just against themselves.
#
# What this does NOT do is skip duplicate work. A cron that GitHub dispatches
# hours late (measured: 4.6h average, never under 1.7h) still runs after the
# one it collided with, it just waits its turn. cancel-in-progress stays false
# because the alternative is killing a 40-minute run at minute 39.
concurrency:
  group: propertytracker-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Self-hosted runner: since 2026-09-29 the site answers HTTP 200 with no
    # content to GitHub's datacenter IPs (both search and detail pages), so the
    # scrape only works from a residential Chilean connection. If the machine
    # is asleep at cron time the job queues and runs when it wakes up.
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/setup-python is NOT used: on a self-hosted macOS runner the
      # package it downloads has /Users/runner/hostedtoolcache hardcoded in its
      # install script (Python binaries carry absolute paths), it fails with
      # "mkdir: /Users/runner: Permission denied", and no environment variable
      # redirects it. Instead: a persistent venv built from the machine's own
      # Python, which also gets reused between runs.
      - name: Set up Python venv
        run: |
          VENV="$HOME/.venvs/propertytracker"
          if [ ! -x "$VENV/bin/python" ]; then
            PY=""
            for c in python3.11 /usr/local/bin/python3 /opt/homebrew/bin/python3 python3; do
              if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
            done
            if [ -z "$PY" ]; then echo "No python3 found"; exit 1; fi
            echo "Creating venv with $PY ($($PY --version 2>&1))"
            "$PY" -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --disable-pip-version-check -r requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run rental scraper
        run: python main_arriendo.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/portalinmobiliario_rentals.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update rental listings data"

          # Retry with rebase to survive concurrent pushes to main
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying ($i/5)..."
            git pull --rebase --autostash origin main
          done

          echo "Push failed after 5 attempts"
          exit 1
